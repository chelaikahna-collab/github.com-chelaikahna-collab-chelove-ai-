<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chelove AI - Li & Ekri Feyton</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>body{font-family:'Poppins',sans-serif}</style>
</head>
<body class="bg-[#fff5f7]">
<header class="bg-white p-4 flex justify-between items-center shadow-sm sticky top-0 z-10">
<div class="flex items-center gap-2">
<div class="w-9 h-9 bg-gradient-to-br from-pink-500 to-yellow-400 rounded-full flex items-center justify-center text-white font-bold">C</div>
<h1 class="font-bold text-xl text-pink-600">Chelove AI</h1>
</div>
<button onclick="showEkri()" class="bg-pink-600 text-white px-5 py-2 rounded-full text-sm font-bold">+ Ekri</button>
</header>

<div id="home" class="p-5 max-w-3xl mx-auto">
<div class="bg-gradient-to-r from-pink-600 to-yellow-500 text-white p-6 rounded-2xl mb-6">
<h2 class="text-2xl font-bold">Byenveni sou Chelove AI</h2>
<p class="text-sm mt-2 opacity-90">Premye platfom kreyol kote ou ka li feyton, ekri pa ou, fe kob ak MonCash/NatCash.</p>
<div class="mt-4 flex gap-2 text-xs"><span class="bg-white/20 px-3 py-1 rounded-full">MonCash</span><span class="bg-white/20 px-3 py-1 rounded-full">NatCash</span><span class="bg-white/20 px-3 py-1 rounded-full">AI Rezime</span></div>
</div>
<h3 class="font-bold text-lg mb-3">Feyton Popile</h3>
<div id="feyton-list" class="grid gap-4"></div>
</div>

<div id="ekri" class="hidden p-5 max-w-xl mx-auto bg-white min-h-screen">
<button onclick="showHome()" class="text-gray-500">← Tounen Akèy</button>
<h2 class="text-2xl font-bold mt-4 mb-2">Ekri nouvo feyton</h2>
<p class="text-sm text-gray-500 mb-4">Chapit 1 gratis, fe moun peye pou chapit 2 ak MonCash.</p>
<input id="tit" placeholder="Tit: Paran Konsa Yo Mwen Pa Vle Yo" class="w-full p-3 border rounded-xl mb-3">
<input id="ote" value="Mousta Le Sang De Jésus" placeholder="Non otè" class="w-full p-3 border rounded-xl mb-3">
